name: validate

# The manifest is the contract the whole pipeline builds against, so it is checked on every
# change to it. Later phases add the asset validators from the brief's section 5 here.

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/**"
      - "shaders/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "assets/**"
      - "shaders/**"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: read

# This workflow's OWN concurrency group. It no longer shares one with Phase 0 or history-purge,
# so a validate run can never replace a queued Phase 0 or purge dispatch — which the old shared
# `ci-serial` group allowed, silently, because GitHub keeps only one pending run per group.
#
# `cancel-in-progress: true` is deliberate here and only here. Validate answers one question —
# "does this tree pass?" — so a run superseded by a newer commit on the same branch has no value:
# its commit is already history. Cancelling it is visible in the UI as "cancelled", which is a
# different thing from a pending run being replaced without a trace.
#
# The group includes `github.event_name` so a manual dispatch is never cancelled by a push: the
# two land in different groups and both run.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds. Catches syntax errors in every script before any expensive workflow runs.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PyYAML for workflow validation
        run: python -m pip install --quiet pyyaml

      - name: Every script parses
        run: python tools/validate/check_scripts.py

      # The scripts that decide what the pipeline believes, and the generators that decide what
      # the world looks like. check_scripts.py proves they parse; it cannot prove they behave.
      # Each of these has silently lied before — a duplicate asset name overwritten without a
      # word, a passing probe reported as "produced no result", and a slope in the wrong units.
      - name: Tool unit tests
        run: python tools/validate/test_tools.py

  manifest:
    name: Manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Expand the authored manifest
        run: python tools/build_manifest.py

      - name: Structural checks
        run: python tools/validate/check_manifest.py

      - name: Skeleton and retarget checks
        run: python tools/validate/check_skeletons.py

      - name: Material system checks
        # Materials, surface ids and their FX table. Catches the class of mistake that compiles
        # and renders wrongly — a retired surface id, a tiling value that visibly repeats, a
        # foliage material with no wind amplitude, a shader redeclaring a uniform its include
        # already declares (which is a compile error nothing else catches before Godot does).
        run: python tools/validate/check_materials.py

      # Generators are only worth what they produce, so this runs one and checks the output rather
      # than trusting that it imports. It writes into the runner's temp directory: nothing binary
      # is committed, and the check is that the bytes exist and are the right shape.
      - name: Terrain generator produces the maps it claims
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/generators/terrain_maps.py --out "$out" --report "$out/report.json"
          python - "$out" <<'PY'
          import json, struct, sys, os

          out = sys.argv[1]
          expected = {
              "terrain_heightmap_master_1km.png": 16,
              "terrain_biome_mask.png": 8,
              "terrain_surface_id_map.png": 8,
          }
          for name, depth in expected.items():
              path = os.path.join(out, name)
              if not os.path.exists(path):
                  raise SystemExit("%s was not produced" % name)
              with open(path, "rb") as handle:
                  head = handle.read(33)
              if not head.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit("%s is not a PNG" % name)
              width, height, bit_depth = struct.unpack(">IIB", head[16:25])
              if (width, height) != (1025, 1025):
                  raise SystemExit("%s is %dx%d, expected 1025x1025" % (name, width, height))
              if bit_depth != depth:
                  raise SystemExit("%s is %d-bit, expected %d-bit" % (name, bit_depth, depth))

          with open(os.path.join(out, "report.json"), encoding="utf-8") as handle:
              report = json.load(handle)
          coverage = report["coverage"]
          print("terrain: height %.1f..%.1f m, water %.2f%%"
                % (coverage["height_min_m"], coverage["height_max_m"], coverage["water_percent"]))
          print("surface coverage: %s" % coverage["surface_percent"])

          # A world with no water, or no land, is a generator bug rather than a design choice.
          if coverage["water_percent"] < 1.0:
              raise SystemExit("only %.2f%% water: the river and bog did not form"
                               % coverage["water_percent"])
          if coverage["water_percent"] > 60.0:
              raise SystemExit("%.2f%% water: most of the world is under the waterline"
                               % coverage["water_percent"])
          for asset in report["assets"]:
              if not asset.get("sha256") or not asset.get("input_hash"):
                  raise SystemExit("%s has no sha256 or input_hash" % asset["name"])
          print("OK: %d assets" % len(report["assets"]))
          PY

      - name: P1 set per phase
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("assets/manifest.expanded.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          summary = manifest["summary"]
          assets = manifest["assets"]
          print("## Asset manifest")
          print()
          print("| Measure | Count |")
          print("|---|---|")
          print("| Assets (variants expanded) | %d |" % summary["total"])
          for priority, count in summary["by_priority"].items():
              print("| %s | %d |" % (priority, count))
          print()
          print("| Phase | Assets | P1 |")
          print("|---|---|---|")
          for phase, count in summary["by_phase"].items():
              p1 = sum(1 for a in assets if a["phase"] == int(phase) and a["priority"] == "P1")
              print("| %s | %d | %d |" % (phase, count, p1))
          print()
          print("| Category | Assets |")
          print("|---|---|")
          for category, count in summary["by_category"].items():
              print("| %s | %d |" % (category, count))
          PY
