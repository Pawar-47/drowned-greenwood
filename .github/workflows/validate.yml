name: validate

# The manifest is the contract the whole pipeline builds against, so it is checked on every
# change to it. Later phases add the asset validators from the brief's section 5 here.

on:
  workflow_dispatch:
    inputs:
      publish_terrain:
        description: "Commit the generated terrain maps and their built evidence to the staging branch"
        type: boolean
        default: false
  push:
    paths:
      - "assets/**"
      - "shaders/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "assets/**"
      - "shaders/**"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: read

# This workflow's OWN concurrency group. It no longer shares one with Phase 0 or history-purge,
# so a validate run can never replace a queued Phase 0 or purge dispatch — which the old shared
# `ci-serial` group allowed, silently, because GitHub keeps only one pending run per group.
#
# `cancel-in-progress: true` is deliberate here and only here. Validate answers one question —
# "does this tree pass?" — so a run superseded by a newer commit on the same branch has no value:
# its commit is already history. Cancelling it is visible in the UI as "cancelled", which is a
# different thing from a pending run being replaced without a trace.
#
# The group includes `github.event_name` so a manual dispatch is never cancelled by a push: the
# two land in different groups and both run.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds. Catches syntax errors in every script before any expensive workflow runs.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PyYAML for workflow validation
        run: python -m pip install --quiet pyyaml

      - name: Every script parses
        run: python tools/validate/check_scripts.py

      # The scripts that decide what the pipeline believes, and the generators that decide what
      # the world looks like. check_scripts.py proves they parse; it cannot prove they behave.
      # Each of these has silently lied before — a duplicate asset name overwritten without a
      # word, a passing probe reported as "produced no result", and a slope in the wrong units.
      - name: Tool unit tests
        run: python tools/validate/test_tools.py

      # check_scripts.py proves each `uses:` names a 40-character commit; only the API proves that
      # commit exists. A wrong SHA passes every static check and then fails every job at setup,
      # which reads like an outage rather than a bad pin. A 404 fails; a rate limit or a network
      # error warns; a run that resolved nothing fails, because it verified nothing.
      - name: Every pinned action exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/validate/check_action_pins.py

  manifest:
    name: Manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Expand the authored manifest
        run: python tools/build_manifest.py

      - name: Structural checks
        run: python tools/validate/check_manifest.py

      - name: Skeleton and retarget checks
        run: python tools/validate/check_skeletons.py

      - name: Material system checks
        # Materials, surface ids and their FX table. Catches the class of mistake that compiles
        # and renders wrongly — a retired surface id, a tiling value that visibly repeats, a
        # foliage material with no wind amplitude, a shader redeclaring a uniform its include
        # already declares (which is a compile error nothing else catches before Godot does).
        run: python tools/validate/check_materials.py

      # A number in prose is a claim about the code. README said "15 unit tests" when there were
      # 35, and ADDITIONS.md said 1024² twice while every generator wrote 1025². Both were found
      # by a person reading, which is not a gate.
      - name: Documentation agrees with the code
        run: python tools/validate/check_docs.py

      # Three audit reports in a row were answered partly. This fails the build if any clause of
      # the audit loses its state, its evidence, or its row. Silence becomes a red job.
      - name: Every audit clause is accounted for
        run: python tools/validate/check_audit_ledger.py

      # Generators are only worth what they produce, so this runs one and checks the output rather
      # than trusting that it imports. It writes into the runner's temp directory: nothing binary
      # is committed, and the check is that the bytes exist and are the right shape.
      - name: Terrain generator produces the maps it claims
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/generators/terrain_maps.py --out "$out" --report "$out/report.json"
          python - "$out" <<'PY'
          import json, struct, sys, os

          out = sys.argv[1]
          expected = {
              "terrain_heightmap_master_1km.png": 16,
              "terrain_biome_mask.png": 8,
              "terrain_surface_id_map.png": 8,
          }
          for name, depth in expected.items():
              path = os.path.join(out, name)
              if not os.path.exists(path):
                  raise SystemExit("%s was not produced" % name)
              with open(path, "rb") as handle:
                  head = handle.read(33)
              if not head.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit("%s is not a PNG" % name)
              width, height, bit_depth = struct.unpack(">IIB", head[16:25])
              if (width, height) != (1025, 1025):
                  raise SystemExit("%s is %dx%d, expected 1025x1025" % (name, width, height))
              if bit_depth != depth:
                  raise SystemExit("%s is %d-bit, expected %d-bit" % (name, bit_depth, depth))

          with open(os.path.join(out, "report.json"), encoding="utf-8") as handle:
              report = json.load(handle)
          coverage = report["coverage"]
          percent = coverage["surface_percent"]
          print("terrain: height %.1f..%.1f m, water %.2f%%"
                % (coverage["height_min_m"], coverage["height_max_m"], coverage["water_percent"]))
          print("surface coverage: %s" % percent)

          # Quality floors, not targets. The first version of the generator produced a world that
          # was 82 % bare rock — a mountain, not the temperate rainforest valley the brief
          # describes — and every structural check passed, because the map was well-formed and
          # simply wrong. These bounds are the ones that would have caught it.
          #
          # Surface ids: 4 = wet_stone (bare rock), 3 = moss, 12 = grass, 8/9 = water.
          #
          # These floors are deliberately NOT set at the values the generator happens to produce.
          # Round 2 of the terrain produced 40 % rock and the floor was 40 %, so the check passed
          # while doing no work at all — a threshold set at the observed value is decoration.
          rock = percent.get("4", 0.0)
          green = percent.get("3", 0.0) + percent.get("12", 0.0)
          if rock > 30.0:
              raise SystemExit(
                  "%.1f%% of the world is bare rock: this is a forest valley, not a mountain" % rock
              )
          if green < 30.0:
              raise SystemExit(
                  "only %.1f%% moss and grass: the forest floor did not form" % green
              )
          if coverage["water_percent"] <= 0.0:
              raise SystemExit("no water at all: the river and bog did not form")
          if coverage["water_percent"] > 60.0:
              raise SystemExit("%.2f%% water: most of the world is under the waterline"
                               % coverage["water_percent"])
          if len(coverage["surface_histogram"]) < 3:
              raise SystemExit("only %d surfaces used; the map is degenerate"
                               % len(coverage["surface_histogram"]))

          # Shape gates. Every previous check was about formats and value ranges, and a terrain
          # with a 20 m cliff across it passed all of them: a heightfield can be perfectly
          # well-formed and still be a quarry.
          max_step = coverage["max_neighbour_step_m"]
          if max_step > 6.0:
              raise SystemExit(
                  "the largest height step between neighbouring texels is %.1f m, which is a "
                  "cliff rather than a slope: a carve stopped abruptly" % max_step
              )
          walkable = coverage["land_under_30_deg_percent"]
          if walkable < 85.0:
              raise SystemExit(
                  "only %.1f%% of the land is under 30 degrees; most of the world is unwalkable"
                  % walkable
              )
          print("shape: largest neighbour step %.1f m, %.1f%% of land under 30 degrees"
                % (max_step, walkable))
          for asset in report["assets"]:
              if not asset.get("sha256") or not asset.get("input_hash"):
                  raise SystemExit("%s has no sha256 or input_hash" % asset["name"])
          print("OK: %d assets" % len(report["assets"]))
          PY

      # Hydrology reads the heightmap terrain_maps just wrote, so it proves the sidecar contract
      # too: if the scale metadata were missing or stale, this step would refuse rather than
      # placing water at the wrong height.
      - name: Hydrology derives from the heightmap
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/generators/hydrology.py \
            --heightmap "$out/terrain_heightmap_master_1km.png" \
            --out "$out" --report "$out/hydrology.json"
          python - "$out" <<'PY'
          import json, os, struct, sys

          out = sys.argv[1]
          with open(os.path.join(out, "hydrology.json"), encoding="utf-8") as handle:
              report = json.load(handle)
          coverage = report["coverage"]
          print("hydrology: %.2f%% water, %d river points, max flow %d cells"
                % (coverage["water_percent"], coverage["river_points"], coverage["max_flow_cells"]))

          for name in ("terrain_hydrology_mask.png", "terrain_shore_mask.png",
                       "terrain_river_splines.json", "terrain_water_level_table.json"):
              if not os.path.exists(os.path.join(out, name)):
                  raise SystemExit("%s was not produced" % name)

          # The mask carries depth in R and the flow direction as a vector in G,B. It used to be
          # written as a 2-channel PNG, which is grey+alpha — not "R and G" — so Godot would have
          # put the direction in the alpha channel and mirrored the depth into G. The channel
          # count is the contract, so it is asserted rather than assumed.
          with open(os.path.join(out, "terrain_hydrology_mask.png"), "rb") as handle:
              head = handle.read(26)
          width, height, bit_depth, colour = struct.unpack(">IIBB", head[16:26])
          if (width, height, bit_depth, colour) != (1025, 1025, 8, 2):
              raise SystemExit(
                  "hydrology mask is %dx%d depth %d colour type %d, expected 1025x1025 depth 8 "
                  "colour type 2 (RGB)" % (width, height, bit_depth, colour)
              )

          # A river that does not exist is the failure worth catching: flow accumulation is
          # easy to get subtly wrong (wrong neighbour order, wrong iteration direction) and the
          # output still looks like a plausible mask.
          if coverage["river_points"] < 20:
              raise SystemExit(
                  "only %d river centreline points: the channel did not form"
                  % coverage["river_points"]
              )
          if coverage["water_percent"] <= 0.0:
              raise SystemExit("no water: neither the bog nor the river formed")

          with open(os.path.join(out, "terrain_river_splines.json"), encoding="utf-8") as handle:
              spline = json.load(handle)["points"]
          # The channel is traced by following the downhill pointer, so consecutive points must
          # descend. A polyline that climbs means the trace is not following the flow, and the
          # first version of this extractor (highest-flow cell per row) failed here with 477 of
          # 941 segments going uphill — a centreline zig-zagging along one reach.
          climbs = sum(1 for a, b in zip(spline, spline[1:]) if b["height_m"] > a["height_m"])
          if climbs:
              raise SystemExit(
                  "the river climbs at %d of %d segments: the trace is not following the flow"
                  % (climbs, len(spline) - 1)
              )
          # A trace that stops immediately means the headwater search found nothing useful.
          if len(spline) < 50:
              raise SystemExit(
                  "the channel is only %d points long; the headwater search is not finding the "
                  "main stem" % len(spline)
              )

          # The water has to sit above the bed or it is inside the ground. The first version
          # subtracted the depth instead of adding it, so the upper river was invisible for 226 of
          # 655 points and no other check noticed.
          with open(os.path.join(out, "terrain_water_level_table.json"), encoding="utf-8") as handle:
              levels = json.load(handle)["levels"]
          submerged = [
              level for level in levels if level["water_surface_m"] <= level["bed_height_m"]
          ]
          if submerged:
              raise SystemExit(
                  "%d of %d river points have the water surface at or below the bed, so the water "
                  "is inside the ground: first offender %r"
                  % (len(submerged), len(levels), submerged[0])
              )
          print("water table: %d points, every surface above its bed" % len(levels))
          print("river: %d points, %.1f m to %.1f m, every segment descends"
                % (len(spline), spline[0]["height_m"], spline[-1]["height_m"]))
          PY

      - name: Terrain material maps derive from the heightmap
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/generators/terrain_surfaces.py \
            --heightmap "$out/terrain_heightmap_master_1km.png" \
            --out "$out" --report "$out/surfaces.json"
          python - "$out" <<'PY'
          import json, os, struct, sys

          out = sys.argv[1]
          expected = {
              # name: (width, height, bit depth, colour type)
              "terrain_normalmap_master.png": (1025, 1025, 8, 2),   # RGB
              "terrain_splat_0.png": (1025, 1025, 8, 6),            # RGBA
              "terrain_splat_1.png": (1025, 1025, 8, 6),
              "terrain_macro_noise_texture.png": (1024, 1024, 8, 0),  # grayscale, tiled
          }
          for name, want in expected.items():
              path = os.path.join(out, name)
              if not os.path.exists(path):
                  raise SystemExit("%s was not produced" % name)
              with open(path, "rb") as handle:
                  head = handle.read(26)
              width, height, bit_depth, colour = struct.unpack(">IIBB", head[16:26])
              got = (width, height, bit_depth, colour)
              if got != want:
                  raise SystemExit(
                      "%s is %dx%d depth %d colour type %d, expected %r"
                      % ((name,) + got + (want,))
                  )

          with open(os.path.join(out, "surfaces.json"), encoding="utf-8") as handle:
              report = json.load(handle)
          for asset in report["assets"]:
              if not asset.get("sha256") or not asset.get("input_hash"):
                  raise SystemExit("%s has no sha256 or input_hash" % asset["name"])
          print("terrain surfaces: %d maps" % len(report["assets"]))

          # The blend rules are the contract between the weights and the shader that reads them.
          # A splat map whose thresholds disagree with the shader is silently wrong, so the rules
          # are checked for the fields a shader would need.
          with open(os.path.join(out, "terrain_height_blend_rules.json"), encoding="utf-8") as handle:
              rules = json.load(handle)
          for field in ("slope_rock", "slope_scree", "shore_band_m", "bog_band_m",
                        "water_level_m", "splat_layers"):
              if field not in rules:
                  raise SystemExit("blend rules have no %s" % field)
          if len(rules["splat_layers"]) != 8:
              raise SystemExit(
                  "blend rules describe %d splat channels, expected 8"
                  % len(rules["splat_layers"])
              )
          print("blend rules: rock at slope %.2f, scree at %.2f, %d channels"
                % (rules["slope_rock"], rules["slope_scree"], len(rules["splat_layers"])))

          # The splats and the surface-ID map have to agree about what a cell is, or a footstep
          # sounds like grass over visible gravel. They disagreed on 54 % of land cells while both
          # were well-formed.
          agreement = report["coverage"]["splat_id_agreement_percent"]
          if agreement < 95.0:
              raise SystemExit(
                  "the dominant splat matches the surface-ID map on only %.1f%% of land cells; "
                  "they are two classifications of one cell and must be one" % agreement
              )
          print("splats: %.1f%% agreement with the surface-ID map over %d land cells"
                % (agreement, report["coverage"]["land_cells_compared"]))
          PY

      # "Deterministic from the seed" was a claim in reports/phase2.md with nothing behind it. Two
      # runs of the same generator from the same seed must produce identical bytes: otherwise every
      # hash in the manifest is a snapshot of one machine's mood, and a rebuilt asset silently
      # differs from the one that passed the gates.
      #
      # It runs last of the three generator steps on purpose: it compares against the directory they
      # have all written into, and an earlier version of this step sat before hydrology existed and
      # failed looking for a file that had not been generated yet.
      - name: The generators are deterministic
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:-/tmp}"
          a="$root/terrain"
          b="$root/terrain_repeat"
          python tools/generators/terrain_maps.py --out "$b" --report "$b/report.json"
          python tools/generators/hydrology.py \
            --heightmap "$a/terrain_heightmap_master_1km.png" \
            --out "$b" --report "$b/hydrology.json"
          python tools/generators/terrain_surfaces.py \
            --heightmap "$a/terrain_heightmap_master_1km.png" \
            --out "$b" --report "$b/surfaces.json"
          # Only the produced assets, not the report JSON, which records the output directory and
          # would differ for a reason that has nothing to do with determinism.
          for name in \
            terrain_heightmap_master_1km.png terrain_biome_mask.png \
            terrain_surface_id_map.png terrain_meta.json \
            terrain_hydrology_mask.png terrain_shore_mask.png \
            terrain_river_splines.json terrain_water_level_table.json \
            terrain_normalmap_master.png terrain_splat_0.png terrain_splat_1.png \
            terrain_macro_noise_texture.png terrain_height_blend_rules.json
          do
            first=$(sha256sum "$a/$name" | awk '{print $1}')
            second=$(sha256sum "$b/$name" | awk '{print $1}')
            if [ "$first" != "$second" ]; then
              echo "::error::$name differs between two runs of the same generator and seed"
              exit 1
            fi
          done
          echo "determinism: 13 generated files are byte-identical across two runs"

      # The maps were generated and checked, and then thrown away when the runner stopped. That
      # made every "built" claim in reports/phase2.md a description of a file that no longer
      # existed anywhere. They are small — about 5 MB in total, every one well under the 20 MB
      # per-file cap — so they are kept as an artifact until the staging branch exists to carry
      # them into the repository properly.
      - name: Upload the generated terrain maps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terrain-maps
          path: ${{ runner.temp }}/terrain
          retention-days: 14
          if-no-files-found: error

      - name: P1 set per phase
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("assets/manifest.expanded.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          summary = manifest["summary"]
          assets = manifest["assets"]
          print("## Asset manifest")
          print()
          print("| Measure | Count |")
          print("|---|---|")
          print("| Assets (variants expanded) | %d |" % summary["total"])
          for priority, count in summary["by_priority"].items():
              print("| %s | %d |" % (priority, count))
          print()
          print("| Phase | Assets | P1 |")
          print("|---|---|---|")
          for phase, count in summary["by_phase"].items():
              p1 = sum(1 for a in assets if a["phase"] == int(phase) and a["priority"] == "P1")
              print("| %s | %d | %d |" % (phase, count, p1))
          print()
          print("| Category | Assets |")
          print("|---|---|")
          for category, count in summary["by_category"].items():
              print("| %s | %d |" % (category, count))
          PY

  # The maps are generated, gated and then thrown away with the runner. An artifact expires; a
  # committed file does not. This job is the only thing that turns "built and measured in CI" into
  # "exists".
  #
  # It runs on every push to main and on a manual dispatch, and commits only when the generated
  # bytes actually changed, so an unchanged tree costs one comparison and no commit. Waiting for a
  # human to dispatch meant a built asset existed exactly as long as an artifact did.
  #
  # It commits to `staging`, never to main: that is the documented route for binaries, and it keeps
  # main's history free of anything that might later need a purge.
  publish:
    name: Publish the terrain maps to staging
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_terrain) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Regenerated here rather than downloaded as an artifact: the artifact is a build product of
      # a different run, and a file is only evidence if the run that commits it also measured it.
      - name: Generate the maps
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/generators/terrain_maps.py --out "$out" --report "$out/report.json"
          python tools/generators/hydrology.py \
            --heightmap "$out/terrain_heightmap_master_1km.png" \
            --out "$out" --report "$out/hydrology.json"
          python tools/generators/terrain_surfaces.py \
            --heightmap "$out/terrain_heightmap_master_1km.png" \
            --out "$out" --report "$out/surfaces.json"

      - name: Copy the maps into the repository
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          mkdir -p assets/terrain
          for file in "$out"/*.png "$out"/*.json; do
            case "$(basename "$file")" in
              report.json|hydrology.json|surfaces.json) continue ;;
            esac
            cp "$file" assets/terrain/
          done
          ls -l assets/terrain

      # The gates below are the ones this job itself runs before recording: it generated the files,
      # so it can say the composition is sane and that two runs agree.
      - name: Record the built evidence
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/terrain"
          python tools/record_built.py \
            --report "$out/report.json" \
            --report "$out/hydrology.json" \
            --report "$out/surfaces.json" \
            --manifest assets/manifest.json \
            --dir assets/terrain --out assets/built.json \
            --gate composition=from_report \
            --gate channel_contract=checked_in_manifest_job \
            --gate determinism=checked_in_manifest_job

      - name: Rebuild and re-check the manifest
        run: |
          set -euo pipefail
          python tools/build_manifest.py
          python tools/validate/check_manifest.py
          python tools/validate/check_docs.py

      - name: Push to staging
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/terrain assets/built.json
          if git diff --cached --quiet; then
            echo "nothing changed; the maps on staging already match this build"
            exit 0
          fi
          git commit -m "Publish the generated terrain maps and their built evidence"
          # A binary reaches main only by merging staging after the gates pass, never by a direct
          # push, so this is the branch it lands on.
          git push origin HEAD:staging
