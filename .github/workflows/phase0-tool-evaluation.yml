name: phase0-tool-evaluation

# Phase 0 gate: prove, on a real GitHub-hosted runner, that each third-party tool in the
# brief's section 3A actually runs headless and produces something the pipeline can consume.
#
# COST DESIGN. Phase 0 consumed over two hours of runner time because every push re-ran the
# Infinigen install (~10 min) even though it had already passed four times, and because a
# 12-minute run was being used as the test loop for probe changes.
#
# Three things now prevent that:
#   1. `tools/validate/check_scripts.py` parses every Python, shell, JSON and workflow file in
#      seconds. Syntax errors are caught there, not by Blender.
#   2. Infinigen only runs when asked (`run_infinigen`), because it has passed and costs most.
#   3. The probe jobs are independent of each other, so one failure never hides another.

on:
  workflow_dispatch:
    inputs:
      run_infinigen:
        description: "Re-run the Infinigen install probe (about 10 minutes; it has already passed)"
        type: boolean
        default: false
      commit_report:
        description: "Commit reports/tool_evaluation.md back to main when the gate passes"
        type: boolean
        default: false
  push:
    paths:
      - "tools/phase0/**"
      - "tools/TOOLS.md"
      # Shaders are compiled by the Godot job in this workflow. Without this, editing a shader
      # did not trigger the only job that actually compiles one, so a broken include could reach
      # main with every workflow green: validate only does a static hint check.
      - "shaders/**"
      - ".github/workflows/phase0-tool-evaluation.yml"

permissions:
  contents: read

# This workflow's OWN concurrency group, keyed by event and ref. It no longer shares one with
# validate or history-purge, so a push-triggered validate can never replace a queued Phase 0
# dispatch — the failure the old shared `ci-serial` group caused.
#
# `cancel-in-progress: false`: this is a gate, and a run killed half way is a run wasted, which is
# exactly how 120 minutes were burned before. A running Phase 0 always finishes.
#
# `github.event_name` in the group means a manual dispatch and a push never share a group, so a
# push cannot replace a queued manual run either. Two runs of the same event and ref can still
# collide — GitHub keeps one pending — and that is stated in README.md rather than papered over.
concurrency:
  group: phase0-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: "4.2.23"
  BLENDER_DIR: "blender-4.2.23-linux-x64"
  BLENDER_URL: "https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
  # The expected SHA-256, pinned here rather than fetched at build time.
  #
  # The previous version downloaded Blender's .sha256 file and compared, which is right, but
  # only on a cache MISS: on a hit the tarball was never downloaded, the comparison never ran,
  # and the step still printed `RESULT blender_checksum exit=0`. A cached, tampered or truncated
  # Blender was therefore reported as verified. This value is checked on every run, cache or not,
  # because the cache now holds the archive rather than the extracted tree.
  # Source: https://download.blender.org/release/Blender4.2/blender-4.2.23.sha256
  BLENDER_SHA256: "bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404"
  # Modular Tree is a Blender 4.2+ extension declaring blender_version_min = 4.5.0, so it gets
  # its own Blender version. The brief allows one pinned Blender per job.
  BLENDER45_VERSION: "4.5.16"
  BLENDER45_DIR: "blender-4.5.16-linux-x64"
  BLENDER45_URL: "https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz"
  # Source: https://download.blender.org/release/Blender4.5/blender-4.5.16.sha256
  # The first value written here was a transcription slip (b32f024e for f32f024e) and the
  # strict check caught it on its first run, which is the check doing exactly its job: a
  # checksum that is merely plausible is worse than none, because it looks verified.
  BLENDER45_SHA256: "23432b064977908beb1ab4b7f32f024e7331105c875c187dce002aff84b10c11"
  GODOT_VERSION: "4.7.2-stable"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
  # Pinned to the digest GitHub records for this release asset (the `digest` field of the
  # release-asset API), which is computed by GitHub from the uploaded bytes.
  #
  # An earlier version of this file claimed Godot published no checksum at all. That was wrong:
  # it publishes SHA512-SUMS.txt with the release. This uses the SHA-256 because that is what
  # `sha256sum` produces on the runner without a second tool.
  GODOT_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GLTFPACK_URL: "https://github.com/zeux/meshoptimizer/releases/download/v1.3/gltfpack-ubuntu.zip"
  # Same source. Independently confirmed: the CI run measured 0666d9dc… for this archive before
  # it was pinned, and the vendor digest matches character for character.
  GLTFPACK_SHA256: "0666d9dc40d60fe5b9a45f3fc24f8e6ca87112974bd5de9ca57152aa13d06017"
  # Git dependencies are pinned to an exact commit or tag. A HEAD clone means an upstream
  # commit can change a generated asset without this repository changing.
  MPFB2_TAG: "v2.0.18"
  # What refs/tags/v2.0.18 resolved to when it was pinned. The tag is kept only so the log says
  # which release this is; the fetch and the verification both use the commit.
  MPFB2_COMMIT: "d0a32e57a7f915cb2f2b95410e2117648c7bbb7e"
  INFINIGEN_COMMIT: "53033dd55c7191cbc436be6ffbb63c026935a509"
  GLTF_TRANSFORM_VERSION: "4.2.1"
  # The Quaternius release is fetched with `gh release download`. Its archive hash was measured
  # once and written into tools/TOOLS.md but never checked by anything, so a replaced release
  # asset would have gone unnoticed. The inventory step verifies it now.
  QUATERNIUS_ZIP_SHA256: "cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724"
  # Modular Tree ships a compiled pybind11 extension (`m_tree`), so a source clone can never
  # work: `import m_tree` finds the C++ source directory, not a built module, which is exactly
  # the "cannot import name 'm_tree' from 'm_tree'" failure. Its CD workflow publishes a
  # prebuilt linux_x64 extension zip, which is what we install.
  MTREE_VERSION: "5.6.0"
  MTREE_ZIP_URL: "https://github.com/GoodPie/modular_tree/releases/download/5.6.0/modular_tree-5.6.0-linux_x64.zip"
  MTREE_ZIP_SHA256: "698cf57c2fc9e695d241aea7d232493f48027b5930538e6062a6e9e320c9044a"

jobs:
  # Seconds, not minutes. Catches what would otherwise cost a full run.
  static:
    name: Static checks (syntax, JSON, workflow YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install PyYAML for workflow validation
        run: python -m pip install --quiet pyyaml
      - name: Check every script parses
        run: python tools/validate/check_scripts.py

  blender:
    name: Blender, glTF export, previews, gltfpack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache the Blender archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The ARCHIVE, not the extracted tree. Caching the tree meant a cache hit skipped the
          # download and therefore skipped the checksum, while the step still printed
          # `RESULT blender_checksum exit=0` — a verified-looking result for bytes nobody
          # checked. The key carries the expected hash, so a cache entry can only ever match the
          # Blender this workflow pins.
          path: tools/vendor/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-${{ env.BLENDER_SHA256 }}

      - name: Verify and unpack Blender ${{ env.BLENDER_VERSION }}
        run: |
          set -euo pipefail
          source tools/phase0/lib.sh
          mkdir -p tools/vendor artifacts/phase0
          if [ ! -f tools/vendor/blender.tar.xz ]; then
            curl -fsSL -o tools/vendor/blender.tar.xz "$BLENDER_URL"
          fi
          # Checked on every run, cache hit or miss. This is the whole point of caching the
          # archive instead of the tree.
          actual=$(sha256sum tools/vendor/blender.tar.xz | awk '{print $1}')
          echo "blender expected=${BLENDER_SHA256} actual=${actual}" | tee -a "$LOG"
          if [ "$actual" != "${BLENDER_SHA256}" ]; then
            echo "RESULT blender_checksum exit=1" | tee -a "$LOG"
            exit 1
          fi
          echo "RESULT blender_checksum exit=0 version=${BLENDER_VERSION}" | tee -a "$LOG"
          if [ ! -x "tools/vendor/${BLENDER_DIR}/blender" ]; then
            tar -xJf tools/vendor/blender.tar.xz -C tools/vendor
          fi
          echo "tools/vendor/${BLENDER_DIR}" > tools/vendor/.blender_path

      - name: Blender environment and glTF export probe
        run: |
          source tools/phase0/lib.sh
          BLENDER="$(cat tools/vendor/.blender_path)/blender"
          run_capture blender_env "$BLENDER" -b --factory-startup \
            -P tools/phase0/blender_probe_env.py -- --out artifacts/phase0

      - name: Preview render with Cycles CPU (official preview renderer)
        run: |
          source tools/phase0/lib.sh
          BLENDER="$(cat tools/vendor/.blender_path)/blender"
          # Official preview settings: low samples, denoise on, 640x360 per view.
          run_capture render_cycles env PROBE_ENGINE=CYCLES PROBE_SAMPLES=32 PROBE_DENOISE=1 \
            PROBE_WIDTH=640 PROBE_HEIGHT=360 PROBE_OUT=artifacts/phase0/render_cycles.png \
            "$BLENDER" -b --factory-startup -P tools/phase0/blender_probe_render.py

      - name: Install Mesa and Xvfb for software OpenGL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libgles2 \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6

      - name: Preview render with Workbench under Xvfb + llvmpipe (informational)
        continue-on-error: true
        run: |
          source tools/phase0/lib.sh
          BLENDER="$(cat tools/vendor/.blender_path)/blender"
          run_capture render_workbench env LIBGL_ALWAYS_SOFTWARE=1 PROBE_ENGINE=BLENDER_WORKBENCH \
            PROBE_WIDTH=640 PROBE_HEIGHT=360 PROBE_OUT=artifacts/phase0/render_workbench.png \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            "$BLENDER" -b --factory-startup -P tools/phase0/blender_probe_render.py

      - name: Preview render with EEVEE Next under Xvfb + llvmpipe (informational)
        continue-on-error: true
        run: |
          source tools/phase0/lib.sh
          BLENDER="$(cat tools/vendor/.blender_path)/blender"
          run_capture render_eevee env LIBGL_ALWAYS_SOFTWARE=1 PROBE_ENGINE=BLENDER_EEVEE_NEXT \
            PROBE_WIDTH=640 PROBE_HEIGHT=360 PROBE_OUT=artifacts/phase0/render_eevee.png \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            "$BLENDER" -b --factory-startup -P tools/phase0/blender_probe_render.py

      - name: gltfpack simplification, with and without quantization
        continue-on-error: true
        run: |
          source tools/phase0/lib.sh
          mkdir -p tools/vendor/gltfpack
          if [ ! -x tools/vendor/gltfpack/gltfpack ]; then
            curl -fsSL -o tools/vendor/gltfpack.zip "$GLTFPACK_URL"
            archive_sha=$(sha256sum tools/vendor/gltfpack.zip | awk '{print $1}')
            if [ -n "${GLTFPACK_SHA256}" ]; then
              if [ "$archive_sha" != "${GLTFPACK_SHA256}" ]; then
                echo "RESULT gltfpack_checksum ok=False reason=checksum_mismatch expected=${GLTFPACK_SHA256} actual=${archive_sha}" | tee -a "$LOG"
                exit 1
              fi
              echo "RESULT gltfpack_checksum ok=True pinned=True sha256=${archive_sha}" | tee -a "$LOG"
            else
              echo "::warning title=gltfpack archive is not pinned::computed sha256 ${archive_sha}. Paste it into GLTFPACK_SHA256 in this workflow."
              echo "RESULT gltfpack_checksum ok=False reason=unpinned sha256=${archive_sha}" | tee -a "$LOG"
              echo "- **gltfpack archive is UNPINNED.** This run measured \`${archive_sha}\` for \`gltfpack-ubuntu.zip\` v1.3. Paste it into \`GLTFPACK_SHA256\` to make the pin real." >> "$GITHUB_STEP_SUMMARY"
            fi
            unzip -q -o tools/vendor/gltfpack.zip -d tools/vendor/gltfpack
            chmod +x tools/vendor/gltfpack/gltfpack || true
          fi
          # gltfpack -h exits non-zero, and GitHub's default shell is `bash -e`, so the call
          # has to be guarded or it aborts the step before the simplification probes run.
          probe="$(mktemp)"
          set +e
          ./tools/vendor/gltfpack/gltfpack -h >"$probe" 2>&1
          code=$?
          set -e
          cat "$probe" >>"$LOG"
          if grep -qi "usage" "$probe"; then code=0; fi
          echo "RESULT gltfpack_help exit=${code}" | tee -a "$LOG"
          # Plain simplification only: no -cc (meshopt) and no -tc (KTX2) until Godot accepts
          # them. Output is captured because gltfpack's statistics are the only way to tell
          # whether the file it wrote actually contains geometry.
          set +e
          ./tools/vendor/gltfpack/gltfpack \
            -i artifacts/phase0/probe_sphere.glb \
            -o artifacts/phase0/probe_sphere_simplified.glb -si 0.5 \
            >artifacts/phase0/gltfpack_simplify.txt 2>&1
          simplify_code=$?
          # A second file with quantization off: the control that separates "Godot cannot load
          # gltfpack output" from "Godot cannot load quantized attributes".
          ./tools/vendor/gltfpack/gltfpack \
            -i artifacts/phase0/probe_sphere.glb \
            -o artifacts/phase0/probe_sphere_noq.glb -si 0.5 -noq \
            >artifacts/phase0/gltfpack_noq.txt 2>&1
          noq_code=$?
          set -e
          cat artifacts/phase0/gltfpack_simplify.txt >>"$LOG"
          cat artifacts/phase0/gltfpack_noq.txt >>"$LOG"
          echo "RESULT gltfpack_simplify exit=${simplify_code}" | tee -a "$LOG"
          echo "RESULT gltfpack_noq exit=${noq_code}" | tee -a "$LOG"

          # What does -noq actually cost? The decision to drop quantization rests on a single
          # 2,208-triangle sphere, so at least record the bytes it saves or spends: if the
          # quantized file is much smaller, that is a real price paid for compatibility, and it
          # belongs in the report rather than in a comment.
          quantized_bytes=$(stat -c%s artifacts/phase0/probe_sphere_simplified.glb 2>/dev/null || echo 0)
          noq_bytes=$(stat -c%s artifacts/phase0/probe_sphere_noq.glb 2>/dev/null || echo 0)
          echo "RESULT gltfpack_size_cost ok=True quantized_bytes=${quantized_bytes} noq_bytes=${noq_bytes}" | tee -a "$LOG"

      - name: Collect the log alongside the probe outputs
        if: always()
        run: |
          mkdir -p artifacts/phase0
          cp -f phase0_log.txt artifacts/phase0/phase0_log.txt || true

      - name: Upload Phase 0 probe outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-blender
          # One directory only. A multi-path upload roots the artifact at the least common
          # ancestor of its paths, which re-nests the files when the artifact is downloaded.
          path: artifacts/phase0/
          retention-days: 3
          if-no-files-found: warn

  godot:
    name: Godot import gate and shader compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [static, blender, tools]
    # A late probe failing in the Blender or tools job must not hide the import gate: the GLBs
    # it needs are produced by earlier steps.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Blender probe outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase0-blender
          path: artifacts/phase0

      - name: Download tool probe outputs (MPFB2 and MTree GLBs)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase0-tools
          path: artifacts/tools

      - name: Copy the shader includes into the probe project
        run: |
          set -euo pipefail
          # The probe project needs the real includes at res://includes/, so it compiles what
          # the game will compile rather than a copy that has drifted.
          mkdir -p tools/phase0/godot_probe/includes
          cp shaders/*.gdshaderinc shaders/*.gdshader tools/phase0/godot_probe/includes/

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          source tools/phase0/lib.sh
          mkdir -p tools/vendor/godot
          if [ ! -x tools/vendor/godot/godot ]; then
            curl -fsSL -o tools/vendor/godot.zip "$GODOT_URL"
            archive_sha=$(sha256sum tools/vendor/godot.zip | awk '{print $1}')
            if [ -n "${GODOT_SHA256}" ]; then
              if [ "$archive_sha" != "${GODOT_SHA256}" ]; then
                echo "RESULT godot_checksum ok=False reason=checksum_mismatch expected=${GODOT_SHA256} actual=${archive_sha}" | tee -a "$LOG"
                exit 1
              fi
              echo "RESULT godot_checksum ok=True pinned=True sha256=${archive_sha}" | tee -a "$LOG"
            else
              # Reported, never assumed. An empty GODOT_SHA256 used to be indistinguishable from
              # a verified one in every document this pipeline produces.
              echo "::warning title=Godot archive is not pinned::computed sha256 ${archive_sha}. Paste it into GODOT_SHA256 in this workflow."
              echo "RESULT godot_checksum ok=False reason=unpinned sha256=${archive_sha}" | tee -a "$LOG"
              echo "- **Godot archive is UNPINNED.** This run measured \`${archive_sha}\` for \`Godot_v${GODOT_VERSION}_linux.x86_64.zip\`. Paste it into \`GODOT_SHA256\` to make the pin real." >> "$GITHUB_STEP_SUMMARY"
            fi
            unzip -q -o tools/vendor/godot.zip -d tools/vendor/godot
            chmod +x tools/vendor/godot/Godot_v4.7.2-stable_linux.x86_64
            ln -sf Godot_v4.7.2-stable_linux.x86_64 tools/vendor/godot/godot
          fi
          echo "RESULT {\"step\": \"godot_version\", \"ok\": true, \"version\": \"${GODOT_VERSION}\"}" | tee -a "$LOG"
          tools/vendor/godot/godot --version >>"$LOG" 2>&1 || true

      - name: Compile the project's shader includes
        timeout-minutes: 5
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          GODOT="$PWD/tools/vendor/godot/godot"
          # The project must be IMPORTED before any scene runs. Running a scene first made
          # Godot sit waiting for an import that never came: the job hit its 45-minute ceiling
          # and was cancelled. Import is a separate, bounded step.
          run_capture shader_import "$GODOT" --headless \
            --path tools/phase0/godot_probe --import
          # --quit-after bounds the scene run. Without it a scene that fails to reach its
          # quit() call hangs until the job is killed, which is exactly what happened.
          run_capture shader_compile "$GODOT" --headless --quit-after 600 \
            --path tools/phase0/godot_probe shader_probe.tscn

      - name: Import and load the generated GLBs
        run: |
          source tools/phase0/lib.sh
          GODOT="$PWD/tools/vendor/godot/godot"
          if [ ! -f artifacts/phase0/probe_sphere.glb ]; then
            echo "RESULT godot_scene_plain ok=False reason=blender_glb_missing" | tee -a "$LOG"
            echo "The Blender job produced no probe_sphere.glb; its log says why."
            exit 1
          fi
          cp artifacts/phase0/probe_sphere.glb tools/phase0/godot_probe/probe_sphere.glb
          # --headless uses a dummy renderer: no pixels, but a real import and load.
          run_capture godot_import "$GODOT" --headless --path tools/phase0/godot_probe --import
          run_capture godot_load "$GODOT" --headless --path tools/phase0/godot_probe -- label=plain

      - name: Import the generated tree and human
        run: |
          source tools/phase0/lib.sh
          GODOT="$PWD/tools/vendor/godot/godot"
          # The tree is the one asset this phase claims to have produced. If it does not import
          # and load, MTree is not verified, whatever its operators reported.
          for pair in "tree:artifacts/tools/probe_tree.glb" "human:artifacts/tools/probe_human.glb"; do
            label="${pair%%:*}"
            src="${pair#*:}"
            if [ ! -f "$src" ]; then
              echo "RESULT godot_scene_${label} ok=False reason=glb_missing" | tee -a "$LOG"
              continue
            fi
            dir="tools/phase0/godot_probe_${label}"
            rm -rf "$dir"
            cp -r tools/phase0/godot_probe "$dir"
            rm -rf "$dir/.godot"
            cp "$src" "$dir/probe_sphere.glb"
            run_capture "godot_import_${label}" "$GODOT" --headless --path "$dir" --import
            run_capture "godot_load_${label}" "$GODOT" --headless --path "$dir" -- "label=${label}"
          done

      - name: Import and load the gltfpack-simplified GLBs
        run: |
          source tools/phase0/lib.sh
          GODOT="$PWD/tools/vendor/godot/godot"
          # Two runs: quantized (the default) and -noq. If the first fails to load and the
          # second succeeds, quantization is the cause and -noq is the setting to use.
          for variant in gltfpack gltfpack_noq; do
            if [ "$variant" = "gltfpack" ]; then
              src=artifacts/phase0/probe_sphere_simplified.glb
            else
              src=artifacts/phase0/probe_sphere_noq.glb
            fi
            if [ ! -f "$src" ]; then
              echo "RESULT godot_scene_${variant} ok=False reason=gltfpack_output_missing" | tee -a "$LOG"
              continue
            fi
            dir="tools/phase0/godot_probe_${variant}"
            rm -rf "$dir"
            cp -r tools/phase0/godot_probe "$dir"
            # Start from a clean import cache so the swap cannot be masked by a stale hash.
            rm -rf "$dir/.godot"
            rm -f "$dir/probe_sphere.glb"
            cp "$src" "$dir/probe_sphere.glb"
            run_capture "godot_import_${variant}" "$GODOT" --headless --path "$dir" --import
            run_capture "godot_load_${variant}" "$GODOT" --headless --path "$dir" -- "label=${variant}"
          done

      - name: Collect the log
        if: always()
        run: |
          mkdir -p artifacts/phase0
          cp -f phase0_log.txt artifacts/phase0/phase0_log.txt || true

      - name: Upload Phase 0 Godot log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-godot
          # A single file path does not re-nest, so only the log travels: the GLBs and PNGs
          # are already in the phase0-blender artifact and the shared pool is small.
          path: artifacts/phase0/phase0_log.txt
          retention-days: 3
          if-no-files-found: warn

  tools:
    name: MPFB2, MTree, glTF-Transform, Poly Haven, Quaternius
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Cache the Blender archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tools/vendor/blender.tar.xz
            tools/vendor/blender45.tar.xz
          key: blender-pair-${{ env.BLENDER_VERSION }}-${{ env.BLENDER45_VERSION }}

      - name: Verify and unpack Blender 4.2 and 4.5
        run: |
          set -euo pipefail
          source tools/phase0/lib.sh
          mkdir -p tools/vendor artifacts/phase0

          # 4.2 had NO checksum in this job at all, while the main job verified it — so the same
          # binary was trusted here and checked there, for no reason beyond copy-paste drift.
          if [ ! -f tools/vendor/blender.tar.xz ]; then
            curl -fsSL -o tools/vendor/blender.tar.xz "$BLENDER_URL"
          fi
          actual=$(sha256sum tools/vendor/blender.tar.xz | awk '{print $1}')
          echo "blender expected=${BLENDER_SHA256} actual=${actual}" | tee -a "$LOG"
          if [ "$actual" != "${BLENDER_SHA256}" ]; then
            echo "RESULT blender_checksum exit=1" | tee -a "$LOG"
            exit 1
          fi
          echo "RESULT blender_checksum exit=0 version=${BLENDER_VERSION}" | tee -a "$LOG"
          if [ ! -x "tools/vendor/${BLENDER_DIR}/blender" ]; then
            tar -xJf tools/vendor/blender.tar.xz -C tools/vendor
          fi
          echo "tools/vendor/${BLENDER_DIR}" > tools/vendor/.blender_path

          if [ ! -f tools/vendor/blender45.tar.xz ]; then
            curl -fsSL -o tools/vendor/blender45.tar.xz "$BLENDER45_URL"
          fi
          actual45=$(sha256sum tools/vendor/blender45.tar.xz | awk '{print $1}')
          echo "blender45 expected=${BLENDER45_SHA256} actual=${actual45}" | tee -a "$LOG"
          if [ "$actual45" != "${BLENDER45_SHA256}" ]; then
            # This used to `exit 0` — a checksum mismatch passed the step and the job carried on
            # with a Blender that was not the pinned one. A mismatch is a failure, not a note.
            echo "RESULT blender45_checksum exit=1" | tee -a "$LOG"
            exit 1
          fi
          echo "RESULT blender45_checksum exit=0 version=${BLENDER45_VERSION}" | tee -a "$LOG"
          if [ ! -x "tools/vendor/${BLENDER45_DIR}/blender" ]; then
            tar -xJf tools/vendor/blender45.tar.xz -C tools/vendor
          fi

      - name: MPFB2 install as extension, register, build and export a human
        continue-on-error: true
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          BLENDER_ROOT="$(cat tools/vendor/.blender_path)"
          BLENDER="${BLENDER_ROOT}/blender"
          # Pinned to an exact COMMIT, not the release tag. A tag is movable: its owner can
          # repoint v2.0.18 at different code, and this repository would then build a different
          # human without changing a single file here. The commit below is what `refs/tags/v2.0.18`
          # resolved to (via the GitHub API, object type "commit"), and the checkout is verified
          # against it rather than assumed.
          if [ ! -d tools/vendor/mpfb2/.git ]; then
            rm -rf tools/vendor/mpfb2
            mkdir -p tools/vendor/mpfb2
            git -C tools/vendor/mpfb2 init --quiet
            git -C tools/vendor/mpfb2 remote add origin https://github.com/makehumancommunity/mpfb2
            git -C tools/vendor/mpfb2 fetch --depth 1 origin "${MPFB2_COMMIT}"
            git -C tools/vendor/mpfb2 checkout --quiet FETCH_HEAD
          fi
          mpfb_actual="$(git -C tools/vendor/mpfb2 rev-parse HEAD)"
          echo "mpfb2 expected=${MPFB2_COMMIT} actual=${mpfb_actual}" | tee -a "$LOG"
          if [ "$mpfb_actual" != "${MPFB2_COMMIT}" ]; then
            echo "RESULT mpfb2_pin ok=False reason=commit_mismatch expected=${MPFB2_COMMIT} actual=${mpfb_actual}" | tee -a "$LOG"
            exit 1
          fi
          echo "RESULT mpfb2_pin ok=True commit=${mpfb_actual} tag=${MPFB2_TAG}" | tee -a "$LOG"
          # MPFB2 is an EXTENSION: src/mpfb/blender_manifest.toml exists, and its register()
          # calls bpy.utils.extension_path_user(__package__), which raises
          #   ValueError: The "package" does not name an extension
          # unless the package is installed in an extensions repo. Installing it into
          # scripts/addons as a legacy add-on could never work, however many files arrived.
          python3 tools/phase0/zip_extension.py tools/vendor/mpfb2/src/mpfb tools/vendor/mpfb2.zip | tee -a "$LOG"
          set +e
          out="$(mktemp)"
          "$BLENDER" -b --factory-startup \
            --command extension install-file -r user_default --enable \
            tools/vendor/mpfb2.zip >"$out" 2>&1
          code=$?
          cat "$out" >>"$LOG"
          rm -f "$out"
          echo "RESULT mpfb2_extension_install exit=${code}" | tee -a "$LOG"
          set -e
          # PROBE_OUT into the uploaded directory, or the generated GLB is written to /tmp and
          # silently lost.
          run_capture mpfb2 env PROBE_OUT=artifacts/phase0 \
            "$BLENDER" -b --factory-startup -P tools/phase0/blender_probe_mpfb2.py
          ls -l artifacts/phase0/probe_human.glb >>"$LOG" 2>&1 || true

      - name: MTree download prebuilt extension and generate a tree
        continue-on-error: true
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          BLENDER45="$(pwd)/tools/vendor/${BLENDER45_DIR}/blender"

          # Download the PREBUILT release, not the source. MTree's operators call
          # `from m_tree import m_tree`, and `m_tree` is a compiled pybind11 extension built
          # with scikit-build-core. A source clone has the C++ source under a directory named
          # `m_tree`, so Python finds a namespace package with no module inside it:
          #   cannot import name 'm_tree' from 'm_tree' (unknown location)
          # The project's CD workflow builds the extension and packages it with the addon; the
          # linux_x64 asset is that package. Verified against the published sha256.
          mkdir -p tools/vendor
          if [ ! -f tools/vendor/modular_tree.zip ]; then
            curl -fsSL -o tools/vendor/modular_tree.zip "${MTREE_ZIP_URL}"
          fi
          actual=$(sha256sum tools/vendor/modular_tree.zip | awk '{print $1}')
          echo "mtree expected=${MTREE_ZIP_SHA256} actual=${actual}" | tee -a "$LOG"
          if [ "$actual" != "${MTREE_ZIP_SHA256}" ]; then
            echo "RESULT mtree_download exit=1 reason=checksum_mismatch" | tee -a "$LOG"
            exit 0
          fi
          echo "RESULT mtree_download exit=0 version=${MTREE_VERSION}" | tee -a "$LOG"
          unzip -l tools/vendor/modular_tree.zip | head -30 >>"$LOG" 2>&1

          set +e
          out="$(mktemp)"
          "$BLENDER45" -b --factory-startup \
            --command extension install-file -r user_default --enable \
            tools/vendor/modular_tree.zip >"$out" 2>&1
          ext_code=$?
          cat "$out" >>"$LOG"
          rm -f "$out"
          echo "RESULT mtree_extension_install exit=${ext_code}" | tee -a "$LOG"
          set -e
          # PROBE_OUT into the uploaded directory, so the generated tree survives the run and
          # the Godot job can import it. Defaulting to /tmp lost every tree ever generated.
          run_capture mtree env PROBE_OUT=artifacts/phase0 \
            "$BLENDER45" -b --factory-startup -P tools/phase0/blender_probe_mtree.py
          ls -l artifacts/phase0/probe_tree.glb >>"$LOG" 2>&1 || true

      - name: glTF-Transform CLI
        continue-on-error: true
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          npm install --no-audit --no-fund --prefix tools/vendor/gltf-transform "@gltf-transform/cli@${GLTF_TRANSFORM_VERSION}" >>"$LOG" 2>&1
          echo "RESULT gltf_transform_install exit=$?" | tee -a "$LOG"
          npx --prefix tools/vendor/gltf-transform gltf-transform --version >>"$LOG" 2>&1
          echo "RESULT gltf_transform_version exit=$?" | tee -a "$LOG"

      - name: Poly Haven API probe
        continue-on-error: true
        run: |
          source tools/phase0/lib.sh
          run_capture polyhaven python3 tools/phase0/polyhaven_probe.py --out artifacts/phase0

      - name: Quaternius animation packs from the third-party release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          # The free Standard ZIPs are uploaded by the owner to the Release
          # "third-party-quaternius", outside git. CI fetches them and reports what is really
          # inside: a measured clip count, never a promised one.
          if ! gh release view third-party-quaternius >/dev/null 2>&1; then
            echo "RESULT quaternius_packs exit=1 reason=release third-party-quaternius not found" | tee -a "$LOG"
            exit 0
          fi
          mkdir -p artifacts/phase0/quaternius
          gh release download third-party-quaternius --dir artifacts/phase0/quaternius --clobber >>"$LOG" 2>&1
          echo "RESULT quaternius_download exit=$?" | tee -a "$LOG"
          find artifacts/phase0/quaternius -maxdepth 1 -type f -printf '%f %s\n' | sort >>"$LOG" 2>&1

          # The archive hash was measured once and written into tools/TOOLS.md, where nothing
          # read it. A release asset can be replaced by whoever controls it, so an unverified
          # "pinned" hash is a comment, not a pin. Verify it here.
          verified=0
          total=0
          for archive in artifacts/phase0/quaternius/*.zip; do
            [ -f "$archive" ] || continue
            total=$((total + 1))
            archive_sha=$(sha256sum "$archive" | awk '{print $1}')
            if [ "$archive_sha" = "${QUATERNIUS_ZIP_SHA256}" ]; then
              verified=$((verified + 1))
              echo "quaternius $(basename "$archive") sha256 matches the pin"
            else
              echo "quaternius $(basename "$archive") sha256=${archive_sha} does NOT match the pin ${QUATERNIUS_ZIP_SHA256}" | tee -a "$LOG"
            fi
          done
          if [ "$total" -eq 0 ]; then
            echo "RESULT quaternius_checksum ok=False reason=no_archives_downloaded" | tee -a "$LOG"
          elif [ "$verified" -eq "$total" ]; then
            echo "RESULT quaternius_checksum ok=True archives=${total}" | tee -a "$LOG"
          else
            # Not fatal: the inventory below still measures what arrived, which is more useful
            # than stopping. But it is a reported failure, so the report shows it.
            echo "RESULT quaternius_checksum ok=False reason=checksum_mismatch verified=${verified} of=${total}" | tee -a "$LOG"
          fi

          unzip -l artifacts/phase0/quaternius/*.zip >>"$LOG" 2>&1 || true
          # Extract OUTSIDE the artifact directory. The extracted animation libraries are tens
          # of MB and nothing downstream needs them; leaving them in artifacts/phase0 pushed the
          # upload to 32 MB against a shared 500 MB pool.
          python3 tools/phase0/quaternius_inventory.py \
            --dir artifacts/phase0/quaternius \
            --extract-dir "${RUNNER_TEMP:-/tmp}/quaternius" \
            --out artifacts/phase0/quaternius_coverage.json | tee -a "$LOG"

      - name: Infinigen clone and install
        # Only when asked. This probe has passed four times and costs about ten minutes, which
        # was the single largest consumer of Phase 0 runner time.
        if: ${{ inputs.run_infinigen }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          INFINIGEN_MINIMAL_INSTALL: "False"
          INFINIGEN_INSTALL_TERRAIN: "True"
        run: |
          set -uo pipefail
          source tools/phase0/lib.sh
          if [ ! -d tools/vendor/infinigen ]; then
            mkdir -p tools/vendor/infinigen
            git -C tools/vendor/infinigen init --quiet
            git -C tools/vendor/infinigen remote add origin https://github.com/princeton-vl/infinigen
            git -C tools/vendor/infinigen fetch --depth 1 origin "${INFINIGEN_COMMIT}"
            git -C tools/vendor/infinigen checkout --quiet FETCH_HEAD
          fi
          echo "infinigen_commit=$(git -C tools/vendor/infinigen rev-parse HEAD)" | tee -a "$LOG"
          python -m venv tools/vendor/infinigen_venv
          . tools/vendor/infinigen_venv/bin/activate
          pip install -q --upgrade pip setuptools wheel >>"$LOG" 2>&1
          run_capture infinigen_install pip install -q -e "tools/vendor/infinigen[infinigen1]"
          run_capture infinigen_import python -c "import infinigen, sys; print(infinigen.__file__); print(sys.version)"
          run_capture infinigen_cli python -m infinigen_examples.generate_individual_assets --help

      - name: Collect the log alongside the probe outputs
        if: always()
        run: |
          mkdir -p artifacts/phase0
          cp -f phase0_log.txt artifacts/phase0/phase0_log.txt || true

      - name: Upload Phase 0 tools log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-tools
          # One directory only: a multi-path upload re-nests files on download.
          path: artifacts/phase0/
          retention-days: 3
          if-no-files-found: warn

  report:
    name: Collect tool evaluation report
    runs-on: ubuntu-latest
    needs: [static, blender, godot, tools]
    if: always()
    timeout-minutes: 10
    # Write only for the optional commit step below. Everything else in this job reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/downloaded

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build reports/tool_evaluation.md
        # Writes the report, then exits 1 if a required probe failed. The two steps below must
        # still run in that case — the report is the explanation of the failure, and skipping it
        # is the same mistake as the earlier Gate bug: the reason existed but never reached the
        # reader. They are `if: always()` for exactly that reason.
        run: |
          set -uo pipefail
          python tools/phase0/make_report.py \
            --logs "$(find artifacts/downloaded -name 'phase0_log.txt' | tr '\n' ' ')" \
            --out reports/tool_evaluation.md

      - name: Job summary
        if: always()
        run: |
          if [ -f reports/tool_evaluation.md ]; then
            cat reports/tool_evaluation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Tool evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The report was not produced. See this job's log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-report
          path: reports/tool_evaluation.md
          retention-days: 14
          if-no-files-found: warn

      # The report was generated and uploaded but never committed, so reports/tool_evaluation.md
      # in the repository only changed when someone remembered to paste it back — which is how it
      # drifts from what CI actually measured.
      #
      # Off by default, and only when the gate passed. Two things make this safe:
      #   * a push made with GITHUB_TOKEN does not trigger a new workflow run (GitHub suppresses
      #     recursive triggers for it), so this cannot start the loop that the one-run-at-a-time
      #     rule forbids;
      #   * it touches no workflow file, which is the other thing GITHUB_TOKEN may not push.
      - name: Commit the report to main
        if: ${{ inputs.commit_report && job.status == 'success' && github.ref_name == 'main' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/tool_evaluation.md; then
            echo "report is unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tool_evaluation.md
          # Two -m flags, not one multi-line string. A literal block scalar ends at the first
          # line with less indentation, so a continuation line at column 0 silently terminated
          # this whole `run:` block and broke the workflow file's YAML — which the static gate
          # caught on the very next run.
          git commit -m "Update the Phase 0 tool evaluation from CI" \
            -m "Generated by tools/phase0/make_report.py from run ${GITHUB_RUN_ID}."
          # The checkout is a detached HEAD on a push run, so push the commit to main by ref
          # rather than relying on the current branch.
          git push origin HEAD:refs/heads/main
