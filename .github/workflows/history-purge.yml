name: history-purge

# MANUAL ONLY. Rewrites git history and force-pushes every ref.
#
# Read docs/HISTORY_PURGE.md first. Do not run this without explicit approval from the project
# owner: it invalidates every clone and fork, and it cannot be undone from here.
#
# SAFETY DESIGN
#
# An earlier version interpolated `${{ inputs.paths }}` and `${{ inputs.confirm }}` directly
# into shell source. On a workflow with `contents: write` and force-push steps, that is a shell
# injection: an input containing a quote or a `$(...)` becomes executable code on a runner that
# holds a token able to rewrite the repository.
#
# This version:
#   * passes inputs through `env:`, never into shell source, so they arrive as data
#   * validates every path against a strict allowlist pattern, one line at a time, with no
#     word splitting and no `xargs`
#   * runs a DRY RUN by default, which changes nothing and uploads the backup
#   * requires `apply` to be typed exactly, on a second dispatch, to force-push
#   * keeps the backup as a downloadable artifact, so it outlives the runner
#
# Prevention is still the normal answer: binaries reach main only by merging the staging branch
# after the gates pass, and a file over 20 MB becomes a Release asset instead of a commit.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma-separated paths to remove from history, e.g. assets/a.glb,assets/b.glb"
        required: true
        type: string
      mode:
        description: "dry-run (safe, changes nothing) or apply (force-pushes; needs a second run)"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirm:
        description: "For apply only: type FORCE-PUSH. Ignored by dry-run."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ci-serial
  cancel-in-progress: false

jobs:
  purge:
    name: Purge history (dry run by default)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # An `apply` run force-pushes every ref and invalidates every clone and fork. It must not be
    # one click away from a dry run.
    #
    # This gates the WHOLE job, dry run included — GitHub environments are job-level, and there
    # is no way to attach one to a single step. That is a deliberate trade: approving any run of
    # a history-rewriting workflow is cheap, and a dry run that nobody looked at is not a
    # safeguard. It is also inert until the owner configures it: declaring the name only creates
    # the environment on first use.
    #
    # If the owner does add themselves as a required reviewer, note that GitHub does not let the
    # person who dispatched a run approve it. On a single-maintainer repository that would
    # deadlock this workflow — so on this repository, leave required reviewers unset and rely on
    # the typed FORCE-PUSH confirmation, or add a second account as reviewer.
    #
    # A token with the `workflows` scope is also required: GITHUB_TOKEN may not push commits
    # touching .github/workflows/, and rewriting history rewrites every commit. The guard below
    # detects that and refuses before touching the remote.
    environment: history-purge
    steps:
      # Inputs arrive as environment variables, so nothing a user types is ever parsed as
      # shell source. `${{ }}` interpolation inside `run:` is what created the injection.
      - name: Validate inputs
        env:
          INPUT_PATHS: ${{ inputs.paths }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$INPUT_MODE" != "dry-run" ] && [ "$INPUT_MODE" != "apply" ]; then
            echo "mode must be dry-run or apply, got: $INPUT_MODE"
            exit 1
          fi

          if [ "$INPUT_MODE" = "apply" ] && [ "$INPUT_CONFIRM" != "FORCE-PUSH" ]; then
            echo "apply requires confirm to be exactly FORCE-PUSH. Aborting without touching anything."
            exit 1
          fi

          # A purge path is a repository-relative path: no leading slash, no `..`, no shell
          # metacharacters, no whitespace. Anything else is rejected rather than escaped,
          # because the allowlist is easier to reason about than quoting.
          : > purge_paths.txt
          count=0
          while IFS= read -r entry; do
            trimmed="$(printf '%s' "$entry" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$trimmed" ] && continue
            if ! printf '%s' "$trimmed" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "rejected: contains characters outside [A-Za-z0-9._/-]: $trimmed"
              exit 1
            fi
            case "$trimmed" in
              /*|*..*)
                echo "rejected: must be relative and must not contain '..': $trimmed"
                exit 1
                ;;
            esac
            printf '%s\n' "$trimmed" >> purge_paths.txt
            count=$((count + 1))
          done < <(printf '%s' "$INPUT_PATHS" | tr ',' '\n')

          if [ "$count" -eq 0 ]; then
            echo "no usable paths given"
            exit 1
          fi
          echo "validated $count path(s):"
          cat purge_paths.txt

      - name: Mirror clone, then strip the credential from it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A token-bearing URL is necessary to clone a private mirror, but `git clone` writes
          # that URL into `.git/config` — and this repository's backup step tars the whole
          # working directory, so the token would be archived and uploaded as an artifact that
          # outlives the job by 90 days. Strip it before anything is copied or archived.
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" purge-work
          git -C purge-work remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          # Prove the strip worked rather than assuming it. If any token-shaped string survives
          # anywhere in the config, stop: an unverified backup is worse than none.
          if grep -rEq 'x-access-token|ghs_|github_pat_|:[A-Za-z0-9_]{30,}@github' purge-work/.git/config; then
            echo "REFUSING: a credential survived in purge-work/.git/config"
            grep -rEo 'x-access-token|ghs_|github_pat_' purge-work/.git/config || true
            exit 1
          fi
          echo "credential stripped from purge-work/.git/config"
          cd purge-work
          echo "size before:" && git count-objects -vH

      - name: Back up the mirror and keep it as an artifact
        run: |
          set -euo pipefail
          cp -r purge-work purge-backup
          # Belt and braces: the copy inherits the already-stripped config, but this checks the
          # copy itself, because that is what gets archived.
          if grep -rEq 'x-access-token|ghs_|github_pat_|:[A-Za-z0-9_]{30,}@github' purge-backup/.git/config; then
            echo "REFUSING: a credential is present in purge-backup/.git/config"
            exit 1
          fi
          tar -czf purge-backup.tar.gz purge-backup
          sha256sum purge-backup.tar.gz | tee purge-backup.sha256
          echo "backup size: $(du -h purge-backup.tar.gz | cut -f1)"

      - name: Scan the archive for credentials before uploading it
        run: |
          set -euo pipefail
          # The archive is what leaves the runner, so scan the archive, not the directory it
          # came from. A token found here means the earlier checks missed a path; fail loudly.
          if tar -xzOf purge-backup.tar.gz ./purge-backup/.git/config 2>/dev/null \
              | grep -Eq 'x-access-token|ghs_|github_pat_'; then
            echo "REFUSING: the archive contains a credential in .git/config"
            exit 1
          fi
          echo "archive scanned: no credential patterns found"

      - name: Install git-filter-repo (pinned)
        run: |
          set -euo pipefail
          # Pinned: an unpinned pip install changes behaviour without the repository changing.
          python3 -m pip install --quiet "git-filter-repo==2.45.0"
          git filter-repo --version

      - name: Rewrite history
        run: |
          set -euo pipefail
          cd purge-work
          args=()
          while IFS= read -r path; do
            args+=(--path "$path")
          done < ../purge_paths.txt
          echo "running: git filter-repo --force --invert-paths ${args[*]}"
          git filter-repo --force --invert-paths "${args[@]}"

      - name: Report the result
        run: |
          set -euo pipefail
          cd purge-work
          echo "size after:" && git count-objects -vH
          git log --oneline -10

      - name: Upload the backup before anything is pushed
        uses: actions/upload-artifact@v4
        with:
          name: purge-backup
          path: |
            purge-backup.tar.gz
            purge-backup.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Force-push every ref
        # Only on an explicit apply run. A dry run stops here, having changed nothing remote
        # and having left a downloadable backup.
        if: ${{ inputs.mode == 'apply' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd purge-work

          # GITHUB_TOKEN may not push commits that touch .github/workflows/. Rewriting history
          # rewrites every commit, so any repository whose history contains workflow files — this
          # one does, from its first commit — cannot be force-pushed with GITHUB_TOKEN at all.
          # This is not an edge case here; it is the expected outcome, so it says so plainly and
          # stops before touching the remote rather than failing partway through.
          if git log --oneline --all -- .github/workflows | head -1 | grep -q .; then
            echo "REFUSING to push: the rewritten history contains commits that touch"
            echo ".github/workflows, which GITHUB_TOKEN is not permitted to push."
            echo ""
            echo "Nothing on the remote has been changed. This repository's history contains"
            echo "workflow commits from its first commit, so an apply run will always stop here"
            echo "until a token with the 'workflows' scope is supplied."
            echo ""
            echo "To proceed: create a fine-grained PAT with Contents: write and Workflows: write"
            echo "on this repository, store it as the HISTORY_PURGE_TOKEN secret, and change the"
            echo "push step below to use it. See docs/HISTORY_PURGE.md."
            exit 1
          fi

          # `git filter-repo` removes the origin remote as a safety measure, so `set-url` alone
          # would fail with "No such remote 'origin'". Add it if it is gone.
          auth_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$auth_url"
          else
            git remote add origin "$auth_url"
          fi
          git push --force --all
          git push --force --tags

      - name: Dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          echo "DRY RUN: history was rewritten in the runner only. Nothing was pushed."
          echo ""
          echo "This run's artifact is purge-backup.tar.gz: a copy of the mirror as it was"
          echo "BEFORE the rewrite, plus its sha256. That is the rollback material."
          echo ""
          echo "The rewritten mirror itself is not uploaded. It would be the same size as the"
          echo "backup and nothing can be restored from it, so it would double the artifact"
          echo "cost for no gain."
          echo ""
          echo "An apply run makes its OWN fresh backup and pushes from its own mirror. It does"
          echo "not reuse this artifact. Review this dry run's report, then dispatch"
          echo "mode=apply with confirm=FORCE-PUSH knowing that apply re-does the work."
